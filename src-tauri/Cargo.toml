[package]
name = "minehost"
version = "0.8.0"
description = "Local Minecraft server manager"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = "=2.8.4"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
uuid = { version = "=1.18.1", features = ["v4"] }
sha2 = "=0.10.9"
sha1 = "=0.10.6"
md-5 = "=0.10.6"
semver = "=1.0.28"
base64 = "=0.22.1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
