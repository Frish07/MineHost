name: Release Windows x64
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Require tag and application versions to match
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($env:RELEASE_TAG -cne "v$version" -or $tauriVersion -cne $version -or $cargo -notmatch "(?m)^version = `"$([regex]::Escape($version))`"\r?$") {
            throw 'Tag, package.json, Cargo.toml and Tauri versions must match'
          }
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      sign_windows: ${{ vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: MineHost-windows-x64
          path: artifacts
      - name: Verify SHA-256 before publication
        shell: pwsh
        run: |
          Get-Content artifacts/SHA256SUMS.txt | ForEach-Object {
            $expected, $file = $_ -split '  ', 2
            if ($file -notmatch '^[A-Za-z0-9._ -]+\.exe$') { throw 'Unsafe artifact filename' }
            if ((Get-FileHash "artifacts/$file" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw "Hash mismatch: $file" }
          }
          if (@(Get-ChildItem artifacts/*.exe).Count -lt 2) { throw 'Missing release binaries' }
      - name: Require Authenticode verification when signing is enabled
        if: vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            ./scripts/Assert-WindowsSignature.ps1 -Path $_.FullName
          }
      - name: Publish only verified artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to replace published binaries' }
          $assets = @(Get-ChildItem artifacts/*.exe | ForEach-Object FullName)
          $assets += (Resolve-Path artifacts/SHA256SUMS.txt).Path
          $assets += (Resolve-Path artifacts/CODE_SIGNING_POLICY.md).Path
          $signingStatus = if ($env:SIGNING_ENABLED -ceq 'true') { 'Windows application and installer passed trusted Authenticode signature verification.' } else { 'Unsigned release: code signing is postponed indefinitely by decision of the project owner and may be dropped. Windows SmartScreen may show Unknown publisher.' }
          $policyUrl = "https://github.com/$env:GH_REPO/blob/$env:RELEASE_TAG/CODE_SIGNING_POLICY.md"
          $notes = "## Code signing policy`n`n$signingStatus`n`nPolicy: $policyUrl`n`n" + (Get-Content artifacts/README.md -Raw)
          $notes | Set-Content release-notes.md -Encoding utf8NoBOM
          $releaseFlags = @()
          $isPrerelease = $env:RELEASE_TAG -match '^v0\.|-'
          if ($isPrerelease) { $releaseFlags += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --notes-file release-notes.md --title "MineHost $env:RELEASE_TAG" --draft @releaseFlags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($isPrerelease) {
            gh release edit $env:RELEASE_TAG --draft=false
          } else {
            gh release edit $env:RELEASE_TAG --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
